# Publishes an app to Google Play with Gradle Play Publisher, started by hand (Actions → Release →
# Run workflow, also from the GitHub mobile app). The version and the notes come from master: a
# release is a merged pull request that bumps versionCode and rewrites
# app/src/main/play/release-notes/<locale>/default.txt; this workflow only ships it.
#
#   upload  + internal     the usual first step: test it from the opt-in link
#   promote + production   then move that same bundle on, without building again
#   upload  + production   straight to production, when no testing round is needed
#   + draft                the app's first production release: Google only accepts a draft on an
#                          app never published; send it for review in Play Console (Publishing overview)
#
# Production waits for an approval (the "production" environment). Each app's upload key lives in
# its own environment (named like the app folder), the Play service account in a repository secret;
# scripts/set-release-secrets.sh puts them there. What an app must not ship without is a secret of
# its environment too, and a release without it fails: league-cards' private league deck (else
# the public sample) and group-polls' Firebase config (else the in-memory sample backend).
name: Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: App
        type: choice
        options: [christmas-countdown, decision-wheel, whos-lying, tournaments, group-polls, league-cards, slipper]
      action:
        description: "upload: build and upload this version · promote: move the internal release on"
        type: choice
        options: [upload, promote]
        default: upload
      track:
        description: Track
        type: choice
        options: [internal, production]
        default: internal
      listing:
        description: Also publish the store listing (texts and graphics)
        type: boolean
        default: false
      draft:
        description: "Draft release (an app's first production release): send it for review in Play Console"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build and check everything, publish nothing"
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  approve:
    name: Approve production
    if: inputs.track == 'production' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Approved ${{ inputs.action }} of ${{ inputs.app }} to production"

  publish:
    name: ${{ inputs.dry_run && 'Dry run' || 'Publish' }} ${{ inputs.app }} (${{ inputs.action }} → ${{ inputs.track }})
    needs: approve
    # Runs after the approval, or straight away when none is needed (internal, dry run).
    if: always() && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.app }}
    permissions:
      contents: write # the release tag
    env:
      APP: ${{ inputs.app }}
      ACTION: ${{ inputs.action }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The upload key, as the build reads it locally (apps/<app>/keystore.properties, git-ignored).
      - name: Upload key
        if: inputs.action == 'upload'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            if [ "${{ inputs.dry_run }}" = true ]; then echo "::warning::No upload key for $APP: the dry run signs with the debug key"; exit 0; fi
            echo "::error::No upload key for $APP: run scripts/set-release-secrets.sh $APP"; exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "apps/$APP/keystore.properties"

      # league-cards: the private deck, where the build looks for it (-PleagueCards.privateDir).
      - name: Private league deck
        if: inputs.app == 'league-cards' && inputs.action == 'upload'
        env:
          LEAGUE_DECK_GZ_BASE64: ${{ secrets.LEAGUE_DECK_GZ_BASE64 }}
        run: |
          if [ -z "$LEAGUE_DECK_GZ_BASE64" ]; then
            if [ "${{ inputs.dry_run }}" = true ]; then echo "::warning::No private deck: the dry run builds the sample"; exit 0; fi
            echo "::error::No private deck: run scripts/set-release-secrets.sh league-cards"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/deck"
          echo "$LEAGUE_DECK_GZ_BASE64" | base64 --decode | gunzip > "$RUNNER_TEMP/deck/league-private.json"
          echo "GRADLE_EXTRA=-PleagueCards.privateDir=$RUNNER_TEMP/deck" >> "$GITHUB_ENV"

      # group-polls: the Firebase project (apps/group-polls/firebase.properties, git-ignored).
      - name: Firebase config
        if: inputs.app == 'group-polls' && inputs.action == 'upload'
        env:
          FIREBASE_PROPERTIES: ${{ secrets.FIREBASE_PROPERTIES }}
        run: |
          if [ -z "$FIREBASE_PROPERTIES" ]; then
            if [ "${{ inputs.dry_run }}" = true ]; then echo "::warning::No Firebase config: the dry run builds the in-memory backend"; exit 0; fi
            echo "::error::No Firebase config: run scripts/set-release-secrets.sh group-polls"; exit 1
          fi
          echo "$FIREBASE_PROPERTIES" > apps/group-polls/firebase.properties

      - name: Play service account
        if: ${{ !inputs.dry_run }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::No Play service account: run scripts/set-release-secrets.sh --play"; exit 1; }

      - name: Version
        id: version
        run: |
          code=$(grep -oE 'versionCode = [0-9]+' "apps/$APP/app/build.gradle.kts" | grep -oE '[0-9]+')
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "## $APP versionCode $code ($ACTION → $TRACK)" >> "$GITHUB_STEP_SUMMARY"

      # Uploading builds the signed bundle; a dry run builds it and validates notes and listing.
      - name: Build and check
        if: inputs.action == 'upload'
        run: ./gradlew ":apps:$APP:app:bundleRelease" ":apps:$APP:app:generateReleasePlayResources" $GRADLE_EXTRA -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Bundle check
        if: inputs.action == 'upload'
        run: |
          aab="apps/$APP/app/build/outputs/bundle/release/app-release.aab"
          scripts/verify-bundle.sh "$aab" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$APP" = league-cards ] && [ "${{ inputs.dry_run }}" != true ]; then
            unzip -l "$aab" | grep -q "league-private.json" || { echo "::error::The bundle has no private deck"; exit 1; }
          fi

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          # Gradle Play Publisher reads the service account's JSON key from here.
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          tasks=()
          if [ "$ACTION" = upload ]; then
            # Same inputs as the build above: Gradle reuses that bundle, it doesn't build another.
            tasks+=(":apps:$APP:app:publishBundle" --track "$TRACK")
          else
            tasks+=(":apps:$APP:app:promoteArtifact" --from-track internal --promote-track "$TRACK")
          fi
          if [ "${{ inputs.draft }}" = true ]; then tasks+=(--release-status draft); fi
          ./gradlew "${tasks[@]}" $GRADLE_EXTRA -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          if [ "${{ inputs.listing }}" = true ]; then ./gradlew ":apps:$APP:app:publishListing"; fi

      # <app>/v<versionCode>, on the commit that was published (once: a promote tags nothing new).
      - name: Tag
        if: ${{ !inputs.dry_run && inputs.action == 'upload' }}
        run: |
          tag="$APP/v${{ steps.version.outputs.code }}"
          git tag "$tag" && git push origin "$tag" || echo "::warning::$tag already exists"
