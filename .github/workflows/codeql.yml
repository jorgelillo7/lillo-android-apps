# Security analysis of the Kotlin code (GitHub CodeQL, free for public repositories): findings show
# up in the repository's Security tab and on the pull request. Kotlin needs a real build to analyse.
name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1" # Mondays, for queries added since the last change
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual
      # A fresh, uncached build so CodeQL sees every Kotlin file compile.
      - run: ./gradlew assembleDebug --no-build-cache --rerun-tasks -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
