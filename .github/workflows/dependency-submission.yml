# Sends the Gradle dependency graph of master to GitHub, so Dependabot alerts and the dependency
# graph cover the apps' libraries, not only the Actions (GitHub cannot read Gradle files itself).
name: Dependency submission

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # the dependency submission API

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
