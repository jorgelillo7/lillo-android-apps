# What each app's version is in this repo and on every Google Play track (production, internal…),
# with the release status. Read only. Run it from Actions → Play status (also from the GitHub app);
# the table is in the run's summary. "In review" isn't in Google's API: Play Console shows it.
name: Play status
run-name: Play status

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the Release workflow's last runs, next to each app
  id-token: write # the service account through Workload Identity Federation (see release.yml)

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Play service account
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/945284400792/locations/global/workloadIdentityPools/github/providers/lillo-android-apps
          service_account: play-publisher@lilloapps-play-publishing.iam.gserviceaccount.com
      - name: Versions in the repo and on Play
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet google-auth==2.62.0 requests==2.34.2
          python3 scripts/play_status.py | tee -a "$GITHUB_STEP_SUMMARY"
