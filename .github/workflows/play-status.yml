# What each app's version is in this repo and on every Google Play track (production, internal…),
# with the release status. Read only. Run it from Actions → Play status (also from the GitHub app);
# the table is in the run's summary. "In review" isn't in Google's API: Play Console shows it.
name: Play status
run-name: Play status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions in the repo and on Play
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth==2.62.0 requests==2.34.2
          python3 scripts/play_status.py | tee -a "$GITHUB_STEP_SUMMARY"
