# CI gate for pull requests: lint, unit tests and a release (R8) build of every app. Branch
# protection on master requires the "Lint", "Test" and "Release" checks below, so a red PR cannot be
# merged. Without the upload keys the release build is signed with the debug key (convention
# plugin), which is all R8 and the Play listing check need. Emulator smoke tests: smoke.yml.
#
# Gradle's build cache (gradle.properties) makes it incremental: a module whose inputs didn't
# change takes its compile, lint and test results from the cache. setup-gradle saves that cache
# only from master, which is why CI also runs on every push to master.
name: CI

on:
  # Every pull request, whatever it targets (a stacked PR gets checks too).
  pull_request:
  # Master: checks what was merged and saves the build cache pull requests read.
  push:
    branches: [master]
  # Manual re-run without pushing an empty commit.
  workflow_dispatch:

# A new push to the PR obsoletes the previous run — cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Formatting (Spotless + ktlint, rules in .editorconfig), then Android lint in every module
      # (all apps and core); any error fails the build. Fix formatting with ./gradlew spotlessApply.
      - run: ./gradlew spotlessCheck lintDebug -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Unit tests of every module, screenshot tests compared with the committed images
      # (src/test/screenshots; re-record with ./gradlew recordRoborazziDebug after a deliberate
      # change), plus a debug build of every app to catch compile errors. The runner has 16 GB; the
      # 2 GB of gradle.properties (sized for an 8 GB laptop) runs D8 out of heap merging the apps.
      - run: ./gradlew test verifyRoborazziDebug assembleDebug -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-diffs
          path: "**/build/outputs/roborazzi/**"

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # R8 (full mode) on every app: missing keep rules and shrinking errors show up here, not on
      # a tester's phone. generateReleasePlayResources validates each Play listing (layout, lengths).
      - run: ./gradlew assembleRelease generateReleasePlayResources -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
